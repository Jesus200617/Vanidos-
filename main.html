<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estación de Empleado - VANIDOS@</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'><circle cx='40' cy='40' r='36' fill='%231f2937' stroke='%23dc2626' stroke-width='3'/><g stroke='%23ffffff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><line x1='28' y1='52' x2='52' y2='28'/><line x1='52' y1='52' x2='28' y2='28'/><circle cx='25' cy='55' r='4.5' fill='%23111827'/><circle cx='55' cy='55' r='4.5' fill='%23111827'/><circle cx='40' cy='40' r='2' fill='%23dc2626' stroke='none'/></g></svg>">

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/all/global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/locales-all.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/skeleton.css' rel='stylesheet' />
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/theme.css' rel='stylesheet' />
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/palettes/purple.css' rel='stylesheet' />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background-color: #1f2937; border-bottom: 2px solid #1d4ed8;">
    <div class="container-fluid">
        <a class="navbar-brand" href="#seccion-citas">
            <svg width="220" height="70" viewBox="0 0 250 80" xmlns="http://www.w3.org/2000/svg">
                <circle cx="40" cy="40" r="30" fill="#1f2937" stroke="#dc2626" stroke-width="2"/>
                <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="28" y1="52" x2="52" y2="28" />
                    <line x1="52" y1="52" x2="28" y2="28" />
                    <circle cx="25" cy="55" r="4" fill="#111827"/>
                    <circle cx="55" cy="55" r="4" fill="#111827"/>
                    <circle cx="40" cy="40" r="1.5" fill="#dc2626" stroke="none"/>
                </g>
                <text x="85" y="48" font-family="'Montserrat', sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="1">VANIDOS<tspan fill="#dc2626">@</tspan></text>
                <text x="88" y="65" font-family="'Montserrat', sans-serif" font-size="10" font-weight="400" fill="#60a5fa" letter-spacing="2">PANEL DE EMPLEADO</text>
            </svg>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
            <ul class="navbar-nav align-items-center">
                <li class="nav-item">
                    <a class="nav-link active fs-6 px-3" href="#seccion-citas">Recepción y Agenda</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                <span class="badge bg-primary">EMPLEADO</span>
                <span id="saludoUsuario" class="text-light fw-semibold"></span>
                <button class="btn btn-outline-light btn-sm" id="btnCerrarSesion">Cerrar Sesión</button>
            </div>
        </div>
    </div>
</nav>

<section id="seccion-citas" class="estructura">
    <div class="estructuraForm">
        <h2>Registrar Cita</h2>
        <form id="formAgendarCita">
            <div class="mb-3">
                <label for="NombreCliente" class="form-label">Nombre del Cliente a Atender</label>
                <input type="text" class="form-control" id="NombreCliente" placeholder="Ej. Roberto Martínez" required>
            </div>
            
            <div class="mb-3">
                <label for="servicioCliente" class="form-label">Servicio Solicitado</label>
                <select class="form-select" id="servicioCliente">
                    <option selected value="Corte de pelo">Corte de pelo ($200)</option>
                    <option value="Tinte">Tinte y Colorimetría ($550)</option>
                    <option value="Barberia">Barbería y Ritual de Barba ($250)</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="fechaCita" class="form-label">Fecha de la cita:</label>
                <input type="date" class="form-control" id="fechaCita" required>
            </div>
                        
            <div class="mb-3">
                <label for="opciones_Horario" class="form-label">Hora disponible</label>
                <select class="form-select" id="opciones_Horario" required>
                    <option value="" disabled selected>Elige primero una fecha arriba</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" id="enviarDatos">Guardar en Agenda</button>
        </form>
    </div>
    
    <div class="estructuraCalendar">
        <h2>Agenda de Trabajo</h2>
        <div id="calendar"></div>
    </div>
</section>

<div id="modal-resumen" class="modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 id="tituloModal" class="modal-title">Detalle</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p id="textModal"></p>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script src="calendar.js"></script>
<script src="formulario.js"></script>
</body>
</html>
