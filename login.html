<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso Personal - VANIDOS@</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-body">

    <div class="login-container">
        <div class="estructuraForm login-card">
            <div style="text-align: center; margin-bottom: 15px;">
                <svg width="230" height="75" viewBox="0 0 250 80" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="40" cy="40" r="30" fill="#1f2937" stroke="#dc2626" stroke-width="2"/>
                    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="28" y1="52" x2="52" y2="28" />
                        <line x1="52" y1="52" x2="28" y2="28" />
                        <circle cx="25" cy="55" r="4" fill="#111827"/>
                        <circle cx="55" cy="55" r="4" fill="#111827"/>
                        <circle cx="40" cy="40" r="1.5" fill="#dc2626" stroke="none"/>
                    </g>
                    <text x="85" y="48" font-family="'Montserrat', sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="1">VANIDOS<tspan fill="#dc2626">@</tspan></text>
                    <text x="88" y="65" font-family="'Montserrat', sans-serif" font-size="10" font-weight="400" fill="#9ca3af" letter-spacing="3">Portal de Personal</text>
                </svg>
            </div>

            <h2>Inicio de Sesion</h2>

            <div id="alertaAuth" class="alert d-none" role="alert"></div>

            <form id="formLogin">
                <div class="mb-3">
                    <label for="loginCorreo" class="form-label">Correo del Personal</label>
                    <input type="email" class="form-control" id="loginCorreo" placeholder="usuario@vanidoso.com" required>
                </div>
                <div class="mb-3">
                    <label for="loginPassword" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary">Iniciar Sesion</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="auth.js"></script>
</body>
</html>
